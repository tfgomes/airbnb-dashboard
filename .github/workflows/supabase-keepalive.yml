# Corre todos os dias: lê as tabelas do Supabase (o que mantém o projeto
# gratuito ativo) e guarda um backup em CSV no repositório quando os dados mudam.
#
# Requer dois secrets no repositório (Settings > Secrets and variables > Actions):
#   SUPABASE_URL  -> o URL do projeto, ex. https://xxxx.supabase.co
#   SUPABASE_KEY  -> a mesma secret key que está nos Streamlit Secrets

name: Supabase keep-alive e backup

on:
  schedule:
    - cron: "17 6 * * *" # todos os dias às 06:17 UTC
  workflow_dispatch: # permite correr à mão no separador Actions

permissions:
  contents: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Ler tabelas do Supabase
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "Faltam os secrets SUPABASE_URL e/ou SUPABASE_KEY." >&2
            exit 1
          fi
          mkdir -p backups

          # exportar <tabela> <ordenação> <obrigatoria|opcional>
          exportar() {
            local tabela="$1" ordem="$2" tipo="$3" tmp
            tmp="$(mktemp)"
            if ! curl -fsS "${SUPABASE_URL%/}/rest/v1/${tabela}?select=*&order=${ordem}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Accept: text/csv" \
              -o "$tmp"; then
              if [ "$tipo" = "opcional" ]; then
                echo "${tabela}: ainda não existe, ignorada"
                return 0
              fi
              echo "Não foi possível ler ${tabela}." >&2
              return 1
            fi
            # grep -c conta também a última linha sem quebra final.
            local linhas
            linhas="$(grep -c '' "$tmp" || true)"
            local registos=$(( linhas > 0 ? linhas - 1 : 0 ))
            echo "${tabela}: ${registos} registos"
            # Nunca substituir um backup bom por um ficheiro vazio.
            if [ "$tipo" = "obrigatoria" ] && [ "$registos" -lt 1 ]; then
              echo "A tabela ${tabela} veio vazia; backup não atualizado." >&2
              return 1
            fi
            mv "$tmp" "backups/${tabela}.csv"
          }

          exportar reservations listing,confirmation_code obrigatoria
          exportar tourist_tax_monthly listing,tax_year,tax_month opcional
          exportar properties listing opcional
          exportar monthly_adjustments listing,adj_year,adj_month opcional
          exportar cost_items listing,cost_year,category opcional
          exportar cost_settings listing,cost_year opcional

      - name: Guardar backup se os dados mudaram
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
          else
            git commit -m "Backup Supabase $(date -u +%F)"
            git push
          fi
